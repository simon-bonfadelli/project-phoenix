# fly.toml app configuration file generated for project-phoenix on 2026-05-15T15:20:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'project-phoenix'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
