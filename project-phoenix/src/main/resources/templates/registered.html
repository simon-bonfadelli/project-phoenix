<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Project Phoenix - Registered</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap"/>
    <style>
        :root {
            --axa-blue: #00008f;
            --axa-blue-dark: #00005b;
            --axa-red: #ff1721;
            --axa-white: #ffffff;
            --axa-grey-light: #f5f5f5;
            --axa-grey-border: #e5e5e5;
            --axa-grey-text: #333333;
            --axa-green: #1cc54e;
            --axa-font: 'Source Sans Pro', 'Segoe UI', Arial, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: var(--axa-font); margin: 0; padding: 16px; background: var(--axa-grey-light); color: var(--axa-grey-text); text-align: center; font-size: 1.125rem; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: var(--axa-white); padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
        h1 { color: var(--axa-green); font-size: 2rem; margin: 8px 0 16px; }
        h2 { color: var(--axa-blue); font-size: 1.5rem; margin: 8px 0; }
        h3 { color: var(--axa-blue); font-size: 1.3rem; }
        p { font-size: 1.1rem; }
        img.avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--axa-blue); }
        .badge {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            background: #e8e8ff; color: var(--axa-blue); margin: 4px 2px; font-size: 1rem; font-weight: 600;
        }
        #group-info img { max-width: 200px; width: 100%; height: auto; }
        #group-info .card { border-top: 4px solid var(--axa-blue); }
        .waiting { color: #999; font-size: 1.1rem; }

        /* Prominent link button */
        .cta-link {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 6px;
            background: var(--axa-blue);
            color: var(--axa-white);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cta-link:hover { background: var(--axa-blue-dark); }
        .cta-link:active { transform: scale(0.99); }

        @media (min-width: 600px) {
            body { padding: 40px 16px; }
            .card { padding: 32px; }
            img.avatar { width: 120px; height: 120px; }
            h1 { font-size: 2.25rem; }
            h2 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>✅ Registered!</h1>
        <img th:src="${user.avatarUrl}" class="avatar" alt="Avatar"/>
        <h2 th:text="${user.generatedName}">Name</h2>
        <span class="badge" th:text="${user.gender}">Gender</span>
        <span class="badge" th:text="${user.jobProfile}">Job</span>
        <span class="badge" th:text="${user.division}">Division</span>
    </div>

    <div id="group-info"
         hx-ext="sse"
         sse-connect="/sse/user"
         sse-swap="group-update"
         hx-swap="innerHTML">
        <div th:if="${group != null}" class="card">
            <h2>🎉 You've been assigned!</h2>
            <h3 th:text="${group.name}">Group</h3>
            <p><strong>Room:</strong> <span th:text="${group.room}">Room</span></p>
            <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code"/>
            <a class="cta-link" href="http://go/phoenix">Go to `http://go/phoenix`</a>
            <p><small th:text="${group.qrCodeUrl}">URL</small></p>
        </div>
        <div th:if="${group == null}" class="card">
            <p class="waiting">⏳ Waiting for group assignment...</p>
        </div>
    </div>
</div>
</body>
</html>
