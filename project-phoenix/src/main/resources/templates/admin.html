<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Project Phoenix - Admin</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap"/>
    <style>
        :root {
            --axa-blue: #00008f;
            --axa-blue-dark: #00005b;
            --axa-red: #ff1721;
            --axa-white: #ffffff;
            --axa-grey-light: #f5f5f5;
            --axa-grey-border: #e5e5e5;
            --axa-grey-text: #333333;
            --axa-green: #1cc54e;
            --axa-font: 'Source Sans Pro', 'Segoe UI', Arial, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: var(--axa-font); margin: 0; padding: 16px; background: var(--axa-grey-light); color: var(--axa-grey-text); }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--axa-white); padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
        h1 { color: var(--axa-blue); font-size: 1.5rem; }
        h2 { color: var(--axa-blue); font-size: 1.15rem; margin: 0 0 12px; }

        /* Responsive table */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--axa-grey-border); font-size: 0.875rem; }
        th { background: var(--axa-blue); color: var(--axa-white); font-weight: 600; white-space: nowrap; }
        tr:hover { background: #f9f9ff; }
        img { border-radius: 50%; }

        .btn {
            display: inline-block; padding: 10px 20px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 0.875rem; font-weight: 700; font-family: var(--axa-font);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-primary { background: var(--axa-blue); color: var(--axa-white); }
        .btn-primary:hover { background: var(--axa-blue-dark); }
        .btn-success { background: var(--axa-green); color: var(--axa-white); }
        .btn-success:hover { background: #17a843; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

        textarea {
            width: 100%; min-height: 160px; padding: 12px; border: 2px solid var(--axa-grey-border);
            border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.8rem; resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--axa-blue); }

        @media (max-width: 600px) {
            .card { padding: 12px; }
            th, td { padding: 8px 6px; font-size: 0.8rem; }
            .btn { padding: 8px 14px; font-size: 0.8rem; }
        }
        @media (min-width: 600px) {
            body { padding: 24px; }
            .card { padding: 24px; }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛠 Project Phoenix — Admin</h1>

    <div class="card">
        <h2>Registered Users (<span id="count" th:text="${#lists.size(users)}">0</span>)</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Avatar</th><th>Name</th><th>Gender</th><th>Job Profile</th><th>Division</th><th>Group</th></tr>
                </thead>
                <tbody id="user-table"
                       hx-ext="sse"
                       sse-connect="/admin/sse"
                       sse-swap="user-update"
                       hx-swap="beforeend">
                <tr th:each="user : ${users}" th:id="'user-' + ${user.id}">
                    <td><img th:src="${user.avatarUrl}" width="32" height="32" alt="avatar"/></td>
                    <td th:text="${user.generatedName}"></td>
                    <td th:text="${user.gender}"></td>
                    <td th:text="${user.jobProfile}"></td>
                    <td th:text="${user.division}"></td>
                    <td th:text="${user.groupId != null ? user.groupId : '-'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>Export / Import</h2>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="exportUsers()">📤 Export JSON</button>
            <button class="btn btn-success" onclick="importGroups()">📥 Import Groups</button>
        </div>
        <textarea id="json-area" placeholder='Export will appear here. For import, paste JSON like:
{
  "groupAssignments": {
    "Gruppe+1": ["userId1", "userId2"],
    "Gruppe+2": ["userId3", "userId4"]
    "Gruppe+3": ["userId5", "userId6"]
    "Gruppe+4": ["userId7", "userId8"]
    "Gruppe+5": ["userId9", "userId10"]
    "Gruppe+6": ["userId11", "userId12"]
    "Gruppe+7": ["userId13", "userId14"]
    "Gruppe+8": ["userId15", "userId16"]
    "Gruppe+9": ["userId17", "userId18"]
    "Gruppe+10": ["userId19", "userId20"]
  }
}'></textarea>
    </div>

    <div class="card">
        <h2>Available Groups</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>Name</th><th>Room</th><th>QR URL</th></tr></thead>
                <tbody>
                <tr th:each="group : ${groups}">
                    <td th:text="${group.id}"></td>
                    <td th:text="${group.name}"></td>
                    <td th:text="${group.room}"></td>
                    <td style="word-break: break-all;" th:text="${group.qrCodeUrl}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function exportUsers() {
        const res = await fetch('/admin/export');
        const data = await res.json();
        document.getElementById('json-area').value = JSON.stringify(data, null, 2);
    }

    async function importGroups() {
        const json = document.getElementById('json-area').value;
        try {
            const data = JSON.parse(json);
            const res = await fetch('/admin/import', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const text = await res.text();
            alert(text);
            location.reload();
        } catch (e) {
            alert('Invalid JSON: ' + e.message);
        }
    }
</script>
</body>
</html>
